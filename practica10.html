<script>
    // 1. Pedimos los datos y los convertimos a numeros
    let a = parseInt(prompt("ingresa el valor de a "));
    let b = parseInt(prompt("ingresa el valor de b "));

    // 2. Realizamos la suma
    let resultado = a + b;

    // 3. Texto en rojo y numeros en negro
    document.write(
        "<span style='color: red;'>El resultado de la suma de </span>" +
        "<b style='color: black;'>" + a + "</b>" +
        "<span style='color: red;'> mas </span>" +
        "<b style='color: black;'>" + b + "</b>" +
        "<span style='color: red;'> es: </span>" +
        "<b style='color: black;'>" + resultado + "</b>"
    );
</script>
